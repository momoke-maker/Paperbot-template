name: Make episode

on:
  push:
    branches: [main]
    paths: ["episodes/**/script.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: episodes
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # skip in the template itself; in your copy it runs once the secrets exist
    if: github.repository != 'momoke-maker/Paperbot-template' 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install requests edge-tts
      - name: Check secrets
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: if [ -z "$T" ]; then echo "Secrets not set yet - see README step 4"; exit 1; fi
      - name: Generate audio and send to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/make_episode.py
      - name: Save results to repo
        if: always()
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          mkdir -p config && touch config/.keep
          git add -A episodes config
          git diff --cached --quiet || git commit -m "Episode audio + status [skip ci]"
          git pull --rebase origin main && git push origin main
