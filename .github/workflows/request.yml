name: Episode on request

on:
  repository_dispatch:
    types: [telegram]
  workflow_dispatch:
    inputs:
      message_json:
        description: "Telegram message JSON (for testing)"
        required: true

permissions:
  contents: write

# no concurrency group: every request runs right away (a shared group would cancel queued requests)

jobs:
  make:
    if: github.repository != 'momoke-maker/Paperbot-template'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install requests==2.34.2 edge-tts==7.3.1
      - name: Write script, render, send
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_MESSAGE_JSON: ${{ github.event.inputs.message_json }}
        run: python scripts/inbox.py
      - name: Save results to repo
        if: always()
        run: bash scripts/save_results.sh "On-request episode [skip ci]"
