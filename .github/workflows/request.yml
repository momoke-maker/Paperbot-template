name: Episode on request

on:
  repository_dispatch:
    types: [telegram]
  workflow_dispatch:
    inputs:
      message_json:
        description: "Telegram message JSON (for testing)"
        required: true

permissions:
  contents: write

concurrency:
  group: episodes
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # skip in the template itself; in your copy it runs once the secrets exist
    if: github.repository != 'momoke-maker/Paperbot-template' 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install requests edge-tts
      - name: Write script, make audio, send
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_MESSAGE_JSON: ${{ github.event.inputs.message_json }}
        run: python scripts/inbox.py
      - name: Save results to repo
        if: always()
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add -A episodes
          git diff --cached --quiet || git commit -m "On-request episode [skip ci]"
          git pull --rebase origin main && git push origin main
